# Feature List                            Edit, add or remove features to be presented.
features:
  - title: Automatic return-by dates
    description: Deadlines based on each store's real policy, your region and your memberships.
    fontawesome_icon_name: calendar-check

  - title: Reminders that work
    description: Get notified before the window closes — or set your own custom reminders.
    fontawesome_icon_name: bell

  - title: AI Scan
    description: Snap a receipt photo or paste a product link and let the app fill in the details. Entirely on device.
    fontawesome_icon_name: magic

  - title: Widgets & Live Activities
    description: Keep the next deadline in view with home-screen widgets and a live countdown.
    fontawesome_icon_name: mobile

  - title: Apple Watch & Mac
    description: Track your returns from your wrist and your desktop.
    fontawesome_icon_name: laptop

  - title: Calendar integration
    description: Add return-by dates as events so deadlines live where you already look.
    fontawesome_icon_name: calendar-alt

  - title: Insights
    description: See spend at risk by store and category, plus refund status at a glance.
    fontawesome_icon_name: chart-pie

  - title: Private by design
    description: Local-first with no account required. Optional iCloud sync via your own Apple ID.
    fontawesome_icon_name: lock

